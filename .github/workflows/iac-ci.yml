# Project:   HyperI CI
# File:      .github/workflows/iac-ci.yml
# Purpose:   Reusable IaC lint workflow for repos with no language pipeline
#
# License:   BUSL-1.1 -- HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Runs `hyperi-ci lint-iac` over the checkout: charts, manifests, kustomize,
# OpenTofu, ansible, compose and Dockerfiles, each switched on by marker. It
# builds, tags and publishes nothing and takes no secrets, so a caller needs no
# `secrets: inherit`. A language repo gets the same linters inside its quality
# stage instead (`quality.iac`).

name: IaC CI

on:
  workflow_call:
    inputs:
      runner-mode:
        type: string
        default: ""
        description: "Runner mode: free (GitHub-hosted) or self-hosted. Empty takes GH_RUNNER_MODE, else the repo's visibility: public free, private self-hosted"
      project-dir:
        type: string
        default: ""
        description: "The project's directory inside the repo, for a repo holding one project per directory. Empty (default) is the repo root."
      runner-default:
        type: string
        default: ""
        description: "Runner for the jobs that otherwise read GH_RUNNER_DEFAULT (plan, gate, release tail), ahead of the variable. For a repo whose projects need different runners, such as the runner-image canary's scenarios."

concurrency:
  # The literal keeps this group apart from a language workflow the same caller
  # runs beside it, which would otherwise cancel one or the other. project-dir
  # keys each project of a monorepo caller apart.
  group: ${{ github.workflow }}-iac-ci${{ inputs.project-dir && format('-{0}', inputs.project-dir) || '' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The HYPERCI_INSTALL_OVERRIDE repo variable replaces the CLI install command: a
  # rehearsal points it at `uvx --python 3.14 --from git+...@<branch> hyperi-ci`, an incident pins
  # `uvx --python 3.14 hyperi-ci==X.Y.Z`; drop --python and uv picks the runner's Python, which may only resolve an old release. Unset = latest PyPI.
  # `--python` pins the CLI's OWN interpreter (issue #157).
  HYPERCI_INSTALL: ${{ vars.HYPERCI_INSTALL_OVERRIDE || 'uvx --python 3.14 --no-cache --refresh --exclude-newer P7D --exclude-newer-package hyperi-ci=P0D --exclude-newer-package scalo=P0D hyperi-ci' }}
  # HYPERCI_QUALITY_SKIP (repo/org variable, e.g. "kubeconform") force-skips a
  # tool whose false positive is halting CI until the real fix lands.
  HYPERCI_QUALITY_SKIP: ${{ vars.HYPERCI_QUALITY_SKIP }}

permissions:
  contents: read

jobs:
  iac:
    name: IaC lint
    # Each tool call is capped at iac.timeout_seconds (600) on its own.
    timeout-minutes: 45
    # lint-iac fetches helm, kubeconform, kube-linter, kustomize, tofu and
    # hadolint at their versions.yaml pins and runs checkov and ansible-lint
    # through uvx, so the default runner is enough (issue #291).
    runs-on: ${{ (github.event.pull_request.head.repo.fork || (inputs.runner-mode || vars.GH_RUNNER_MODE) == 'free' || !(inputs.runner-mode || vars.GH_RUNNER_MODE) && github.event.repository.visibility == 'public') && 'ubuntu-latest' || inputs.runner-default || vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.project-dir || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the job token away from the code this job runs (issue #402).
          persist-credentials: false
      - name: Install uv
        uses: hyperi-io/hyperi-ci/.github/actions/setup-uv@main
        with:
          enable-cache: false
      - name: Lint IaC
        run: ${{ env.HYPERCI_INSTALL }} lint-iac .
