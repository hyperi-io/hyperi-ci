# Project:   HyperI CI
# File:      .github/workflows/versions-audit.yml
# Purpose:   Weekly check that the versions SSOT has not fallen behind upstream
#
# License:   BUSL-1.1 — HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# CI already runs `update-versions.py --check`, but that only proves the
# MIRRORS match the SSOT - drift between our own files. Nothing asked upstream
# whether the SSOT itself was behind, so a pin could sit stale indefinitely and
# every check stayed green. gitleaks drifted nine months that way.
#
# This is the missing half: `--stable` resolves the newest release of every pin
# that has soaked past the cooldown, and `--fail-on-drift` turns that report
# into a signal. Same shape as the gate audit (#96) - a check that only fires
# when someone remembers is a check that does not fire.
#
# Report-only. It never edits a pin; a bump is a reviewed commit, because a
# version bump now also needs its sha256 refreshed (#66).
#
# The schedule keeps the cooldown. `--now` is available on a manual run for a
# supervised update, and is deliberately not the scheduled behaviour: the soak
# is the supply-chain control.

name: Versions audit

on:
  schedule:
    # Monday, an hour after the gate audit, so the two reports do not interleave.
    - cron: "23 21 * * 0"
  workflow_dispatch:
    inputs:
      now:
        type: boolean
        default: false
        description: "Waive the cooldown and take releases as of now."

permissions:
  contents: read

jobs:
  audit:
    name: Versions audit
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Report pins that have fallen behind
        # GH_TOKEN raises the API rate limit; the release lookups are plain
        # reads, so the job token is enough.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sources python scripts/update-versions.py \
            --stable --fail-on-drift ${{ inputs.now && '--now' || '' }}

  digests:
    # `--stable` compares VERSIONS. A release asset re-uploaded under the same
    # tag changes the sha256 and nothing above notices, so run the composites
    # that verify a digest and let `sha256sum -c` be the signal (#66).
    name: Digest audit
    # Not the vars-driven runner: the ARC image bakes these tools, and this job
    # is here to exercise the download-and-verify path on a clean machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # setup-go-tools compiles govulncheck with `go install`.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Verify the osv-scanner digest
        uses: ./.github/actions/setup-osv-scanner

      - name: Verify the Go tool digests
        uses: ./.github/actions/setup-go-tools

      - name: Verify the Rust tool digests
        uses: ./.github/actions/setup-rust-tools

      - name: Verify the cargo-nextest digest
        uses: ./.github/actions/setup-nextest
