# Project:   HyperI CI
# File:      .github/workflows/versions-audit.yml
# Purpose:   Weekly check that the versions SSOT has not fallen behind upstream
#
# License:   BUSL-1.1 -- HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# CI runs `update-versions.py --check`, which only proves the MIRRORS match the
# SSOT. Nothing asked upstream whether the SSOT itself was behind, so a pin could
# sit stale with every check green (gitleaks drifted nine months that way).
#
# `--stable` resolves the newest release of every pin that has soaked past the
# cooldown, and `--fail-on-drift` turns that report into a signal, scheduled like
# the gate audit (#96).
#
# Report-only. It never edits a pin, because a bump is a reviewed commit that
# also refreshes the sha256 (#66).
#
# The schedule keeps the cooldown. `--now` is for a supervised manual run only,
# since the soak is the supply-chain control.

name: Versions audit

on:
  schedule:
    # Monday, an hour after the gate audit, so the two reports do not interleave.
    - cron: "23 21 * * 0"
  workflow_dispatch:
    inputs:
      now:
        type: boolean
        default: false
        description: "Waive the cooldown and take releases as of now."

permissions:
  contents: read

jobs:
  audit:
    name: Versions audit
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Report pins that have fallen behind
        # GH_TOKEN raises the API rate limit; the release lookups are plain
        # reads, so the job token is enough.
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs travel as env, so a workflow input is never read as shell.
          WAIVE_COOLDOWN: ${{ inputs.now }}
        run: |
          now_flag=""
          if [ "$WAIVE_COOLDOWN" = "true" ]; then now_flag="--now"; fi
          uv run --no-sources python scripts/update-versions.py \
            --stable --fail-on-drift $now_flag

      - name: Mint a fleet read token
        # The fixtures are private and GITHUB_TOKEN sees only this repo, so the
        # check below would read every fixture as missing from the org.
        # No `repositories`: `gh repo list` has to see a ci-test-* repo that
        # config/fixtures.yaml does not list yet, and listing names needs
        # metadata only.
        id: bot
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Check the fixture fleet against the org
        # Scheduled rather than on the PR path: it needs network and an
        # authenticated gh, and a fixture is renamed about once a year. An
        # unreachable org exits 2 (fleet NOT checked), which is not "no drift"
        # (issue #215).
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: uv run --no-sources python scripts/check-fixture-fleet.py

      - name: Check semgrep's compatibility rules against the registry
        # The registry serves the pack at scan time, so an id can drift with no
        # semgrep release to bump, and a stale exclude fails silently (issue #486).
        if: always()
        run: uv run --no-sources python scripts/check-semgrep-compat-rules.py

  digests:
    # `--stable` compares VERSIONS. A release asset re-uploaded under the same
    # tag changes the sha256 and nothing above notices, so run the composites
    # that verify a digest and let `sha256sum -c` be the signal (#66).
    name: Digest audit
    # Not the vars-driven runner: this job exercises the download-and-verify path
    # on a clean machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # setup-go-tools compiles govulncheck with `go install`.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # No go.mod here, so the module cache has nothing to key on and the
          # restore would warn on every run.
          cache: false

      - name: Verify the osv-scanner digest
        uses: ./.github/actions/setup-osv-scanner

      - name: Verify the Go tool digests
        uses: ./.github/actions/setup-go-tools

      - name: Verify the Rust tool digests
        uses: ./.github/actions/setup-rust-tools

      - name: Verify the cargo-nextest digest
        uses: ./.github/actions/setup-nextest
