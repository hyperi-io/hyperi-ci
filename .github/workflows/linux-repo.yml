# Project:   HyperI CI
# File:      .github/workflows/linux-repo.yml
# Purpose:   Sign a release's Linux packages and publish them as apt, rpm and apk repos
#
# License:   BUSL-1.1 -- HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# The only job holding the package signing keys, which OpenBao releases to this
# file's job_workflow_ref. It runs no caller code, and the calling job needs
# `permissions: id-token: write`. See docs/linux-packages.md.

name: Linux package repos

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
        description: "Artifact holding the unsigned .deb, .rpm and .apk files."
      channel:
        type: string
        default: release
        description: "release (apt suite stable), beta or alpha."
      keep:
        type: number
        default: 10
        description: "Versions kept per package and arch. 0 keeps all."
      project:
        type: string
        default: ""
        description: "R2 prefix under downloads.hyperi.io. Empty is the repository name."
      runner:
        type: string
        default: ""
        description: "Runner label. It must reach OpenBao, so an ARC x64 runner."
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

env:
  HYPERCI_INSTALL: ${{ vars.HYPERCI_INSTALL_OVERRIDE || 'uvx --python 3.14 --no-cache --refresh --exclude-newer P7D --exclude-newer-package hyperi-ci=P0D --exclude-newer-package scalo=P0D hyperi-ci' }}

jobs:
  publish:
    name: Publish
    runs-on: ${{ inputs.runner || vars.GH_RUNNER_PUBLISH || 'arc-vanilla-4x8' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Each publish rewrites the index from what R2 holds, so two at once lose a release.
    concurrency:
      group: linux-repo-${{ github.repository }}-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: hyperi-io/hyperi-ci/.github/actions/setup-uv@main
        with:
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: packages

      - name: Sign and publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHANNEL: ${{ inputs.channel }}
          KEEP: ${{ inputs.keep }}
          PROJECT: ${{ inputs.project || github.event.repository.name }}
        run: ${{ env.HYPERCI_INSTALL }} linux-repo publish packages --channel "$CHANNEL" --keep "$KEEP" --project "$PROJECT"

      # The caller publishes SHA256SUMS.asc beside the SHA256SUMS its artifact holds.
      - name: Upload the SHA256SUMS signature
        if: hashFiles('packages/SHA256SUMS') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}-sums-sig
          path: packages/SHA256SUMS.asc
          if-no-files-found: error
