# Project:   HyperI CI
# File:      .github/workflows/rust-ci.yml
# Purpose:   Reusable Rust CI workflow for consumer projects
#
# License:   BUSL-1.1 -- HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Rust-specific stages: quality, test, setup, build (with version stamp).
# Container + tag-and-release are delegated to the shared
# _release-tail.yml workflow. Setup uses the shared predict-version
# composite action to avoid duplicating gate+dry-run across languages.

name: Rust CI

on:
  workflow_call:
    inputs:
      runner-mode:
        type: string
        default: ""
        description: "Runner mode: 'free' forces ubuntu-latest, empty uses GH_RUNNER_* vars"
      publish-target:
        type: string
        default: "oss"
        description: "Publish destination (legacy field, ignored — every publish goes to OSS registries)"
      rust-toolchain:
        type: string
        default: "stable"
        description: "Rust toolchain version"
      runner-quality:
        type: string
        default: ""
        description: "Runner for quality job (default: ubuntu-latest)"
      runner-test:
        type: string
        default: ""
        description: "Runner for test job (default: ubuntu-latest)"
      runner-build:
        type: string
        default: ""
        description: "Runner for build job (default: ubuntu-latest)"
      test-matrix:
        type: string
        default: ""
        description: "JSON array of runner OS for test matrix (overrides runner-test)"
      tag:
        type: string
        default: ""
        description: "Tag to publish (workflow_dispatch only)"
      from-head:
        type: string
        default: ""
        description: "'true' on a from-head dispatch (issue #35): release/retry HEAD — the CI creates the tag."
      bump:
        type: string
        default: "auto"
        description: "Version resolution for from-head: auto | patch | minor (forced — release even with no release-worthy commit) | X.Y.Z (exact version)."
      test-tier:
        type: string
        default: "core"
        description: "core | full. full runs the full test tier on this run; core never lowers a tier. A scheduled run is full, and so is a release once the repo sets test.full.required_for_release."
      submodules:
        type: string
        default: ""
        description: "Space-separated submodule paths to init after checkout (e.g. 'schemas'). Empty (default) inits nothing. The submodule must be reachable by the job token - public, or a token with cross-repo read access."
      sibling-checkouts:
        type: string
        default: ""
        description: "Space-separated repos to clone BESIDE the workspace before tests (e.g. 'hyperi-io/dfe-transform-vrl' or 'owner/repo@ref'), for suites that read a sibling checkout. Same reachability rule as submodules: public, or a token with cross-repo read access."
      branch-build:
        type: string
        default: ""
        description: "'true' to run build + container on pull_request events (branch-mode). Also settable repo-wide via the HYPERCI_BRANCH_BUILD variable. Dev-image push is the separate publish.container.dev_push opt-in."
      skip-optimize:
        type: string
        default: ""
        description: "'true' to skip the optimisation stage for this run (Rust: no PGO, no BOLT). Empty = optimisation on."
      release-unoptimized:
        type: string
        default: ""
        description: "'true' to consent, for this run only, to shipping a skipped-optimisation build under a release tag. Without it a release that would have run PGO/BOLT refuses skip-optimize."
      optimize-tier:
        type: string
        default: ""
        description: "'release' to build the release optimisation tier (PGO + BOLT) on a run that publishes nothing. Per run only. Empty = the tier follows whether the run ships."
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      GITLEAKS_GH_ACTIONS_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      CONTAINER_MGT_APP_PRIVATE_KEY:
        required: false

  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to re-publish (existing tag). Omit + set from-head to release HEAD."
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD — the CI creates the tag (issue #35). Mutually exclusive with `tag`."
      bump:
        type: string
        required: false
        default: "auto"
        description: "Version resolution for from-head: auto | patch | minor (forced) | X.Y.Z (exact version)."
      test-tier:
        type: choice
        required: false
        default: "core"
        options: [core, full]
        description: "core | full. full runs the full test tier on this run; core never lowers a tier."
      runner-mode:
        type: string
        default: ""
        description: "Runner mode override"
      publish-target:
        type: string
        default: "oss"
        description: "Publish destination (legacy field, ignored — every publish goes to OSS registries)"
      rust-toolchain:
        type: string
        default: "stable"
        description: "Rust toolchain version"
      skip-optimize:
        type: string
        required: false
        default: ""
        description: "'true' to skip the optimisation stage for this release (Rust: no PGO, no BOLT). Empty = optimisation on."
      release-unoptimized:
        type: string
        required: false
        default: ""
        description: "'true' to consent, for this run only, to shipping a skipped-optimisation build under a release tag. Without it a release that would have run PGO/BOLT refuses skip-optimize."
      optimize-tier:
        type: string
        required: false
        default: ""
        description: "'release' to build the release optimisation tier (PGO + BOLT) on a run that publishes nothing. Per run only. Empty = the tier follows whether the run ships."

concurrency:
  # A schedule and a dispatch that publishes nothing each get their own
  # group: sharing main's, either could cancel a release in flight or be
  # cancelled by the next push.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && inputs.tag == '' && inputs.from-head != 'true' && format('dispatch-{0}', github.ref) || inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  HYPERCI_PUBLISH_TARGET: ${{ inputs.publish-target }}
  # Rehearsal / incident escape hatch: the HYPERCI_INSTALL_OVERRIDE repo
  # variable replaces the CLI install command wholesale -- a branch rehearsal
  # points it at `uvx --from git+...@<branch> hyperi-ci`; an incident pins
  # the repo to a known-good `uvx hyperi-ci==X.Y.Z`. Unset = latest PyPI.
  # `--python` pins the CLI's OWN interpreter. Without it uvx takes whatever
  # interpreter the runner has -- the project's -- and silently back-solves to
  # an old hyperi-ci that allowed it, rather than failing (issue #157).
  HYPERCI_INSTALL: ${{ vars.HYPERCI_INSTALL_OVERRIDE || 'uvx --python 3.14 --no-cache --refresh hyperi-ci' }}
  # Rare edge-case escape hatch: set the HYPERCI_QUALITY_SKIP repo/org
  # variable (e.g. "semgrep") to force-skip a quality tool whose false
  # positive is halting CI, until the real fix lands. Empty when unset.
  HYPERCI_QUALITY_SKIP: ${{ vars.HYPERCI_QUALITY_SKIP }}
  # Skip the optimisation stage: per-run via the input, repo-wide via the
  # variable. Empty = optimisation on.
  HYPERCI_SKIP_OPTIMIZE: ${{ inputs.skip-optimize || vars.HYPERCI_SKIP_OPTIMIZE }}
  # Consent to release a skipped-optimisation build: per-run input only, never
  # a repo variable, so the consent cannot outlive the run.
  HYPERCI_RELEASE_UNOPTIMIZED: ${{ inputs.release-unoptimized }}
  # Ask for the release optimisation tier on a run that publishes nothing:
  # per-run input only, never a repo variable, because the tier adds PGO and
  # BOLT to every build it reaches (issue #257).
  HYPERCI_OPTIMIZE_TIER: ${{ inputs.optimize-tier }}

# Least-privilege GITHUB_TOKEN default for every job (CodeQL
# actions/missing-workflow-permissions). Two jobs elevate: release-tail
# (passes write down to _release-tail.yml - semantic-release commit/tag +
# GHCR) and plan (semantic-release push-access verify on a publish predict).
# commit-check / quality / test / build are read-only.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # plan -- runs FIRST. Computes gate outputs that every downstream job
  # reads. See docs/architecture.md for the full contract.
  #
  # Doctrine: a non-bumping commit (chore/docs/test/refactor/style/build/
  # ci/cleanup/...) MUST NOT cause cargo to compile or docker buildx to
  # push. Even quality + test are skipped on push events that won't ship
  # -- only PR review and release-worthy pushes run them. The gate is
  # computed ONCE here and consumed by every downstream `if:`; do not
  # re-implement the condition string elsewhere -- a pytest test
  # (tests/unit/test_workflow_consistency.py) enforces this.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # predict-version runs semantic-release, whose git plugin verifies push
    # access (a `git push --dry-run`) on a publish predict - needs write.
    # A fork PR never reaches that: will-publish is false off main, so both
    # semantic-release steps skip and the read-only token a fork gets is
    # enough to resolve the gates.
    permissions:
      contents: write
    outputs:
      run-checks: ${{ steps.predict.outputs.run-checks }}
      run-build: ${{ steps.predict.outputs.run-build }}
      run-arm64-check: ${{ steps.predict.outputs.run-arm64-check }}
      will-release: ${{ steps.predict.outputs.will-release }}
      next-version: ${{ steps.predict.outputs.version }}
      test-tier: ${{ steps.predict.outputs.test-tier }}
      full-required-for-release: ${{ steps.predict.outputs.full-required-for-release }}
      prerelease: ${{ steps.predict.outputs.prerelease }}
      build-matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # full history — semantic-release dry-run reads it

      - name: Predict version + derive gates
        id: predict
        uses: hyperi-io/hyperi-ci/.github/actions/predict-version@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag }}
          from-head: ${{ inputs.from-head }}
          bump: ${{ inputs.bump }}
          test-tier: ${{ inputs.test-tier }}
          branch-build: ${{ inputs.branch-build || vars.HYPERCI_BRANCH_BUILD }}

      - name: Install uv (preflight)
        if: steps.predict.outputs.will-release == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Preflight publish credentials
        # semantic-release's verifyConditions equivalent: prove the tokens
        # exist before anything compiles. A missing CARGO_REGISTRY_TOKEN
        # otherwise surfaces at the publish stage, after a full build.
        # Blocks only where the publish handler hard-fails without the
        # credential; PyPI (OIDC fallback) and R2 warn.
        if: steps.predict.outputs.will-release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: ${{ env.HYPERCI_INSTALL }} preflight

      - name: Generate build matrix
        # Arch breadth keys off run-build: every run that builds at all builds
        # both arches. That covers a validate-only dispatch and a branch-mode
        # PR, which are the two on-demand ways to exercise arm64 without
        # publishing. Keying it off will-release meant arm64 first executed on
        # the run meant to ship it, so a Cortex-A53 BOLT refusal was found
        # mid-publish and its fix could not be tested except by publishing
        # again (issue #249).
        #
        # run-arm64-check is the one case that builds where run-build is
        # false: a release-worthy merge to main, which ships, so the doctrine's
        # red line (a merge that ships nothing compiles nothing) is untouched.
        # That leg is arm64 ALONE -- it exists to catch arm64-specific
        # breakage while the change is still attributable, not to rebuild
        # amd64 that every other gate already covered.
        #
        # A project that lists `build.rust.targets` in .hyperi-ci.yaml ships
        # only those arches, so one whose release build does not fit the
        # arm64 runner can still release amd64 (issue #127). A project that
        # lists none keeps both.
        #
        # The renovate/ carve-out must land on a runner with cargo: Rust does
        # not bootstrap its toolchain at job time, and GH_RUNNER_RENOVATE /
        # GH_RUNNER_DEFAULT point at vanilla sets that carry none (issue #91).
        # Chain: GH_RUNNER_RENOVATE_RUST (set e.g. arc-native-4cpu to shed
        # bot load) -> GH_RUNNER_RUST -> hosted ubuntu-latest, which ships
        # cargo.
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          run_build="${{ steps.predict.outputs.run-build }}"
          arm64_check="${{ steps.predict.outputs.run-arm64-check }}"
          AMD64_RUNNER="${{ startsWith(github.head_ref || github.ref_name, 'renovate/') && (vars.GH_RUNNER_RENOVATE_RUST || vars.GH_RUNNER_RUST || 'ubuntu-latest') || (inputs.runner-mode || vars.GH_RUNNER_MODE) == 'free' && 'ubuntu-latest' || inputs.runner-build || vars.GH_RUNNER_RUST || vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}"
          ARM64_RUNNER="${{ vars.GH_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}"
          wanted=""
          if [[ -f .hyperi-ci.yaml ]]; then
            wanted="$(yq -r '.build.rust.targets // [] | .[]' .hyperi-ci.yaml 2>/dev/null | tr '\n' ' ' || true)"
          fi
          want() { [[ -z "$wanted" || " $wanted" == *" $1 "* ]]; }
          amd64='{"target":"x86_64-unknown-linux-gnu","runner":"'"$AMD64_RUNNER"'","os_arch":"linux-amd64"}'
          arm64='{"target":"aarch64-unknown-linux-gnu","runner":"'"$ARM64_RUNNER"'","os_arch":"linux-arm64"}'
          if [[ "$run_build" == "true" ]]; then
            legs=()
            if want x86_64-unknown-linux-gnu; then legs+=("$amd64"); fi
            if want aarch64-unknown-linux-gnu; then legs+=("$arm64"); fi
            # A targets list naming neither still builds amd64 rather than nothing.
            if [[ ${#legs[@]} -eq 0 ]]; then legs=("$amd64"); fi
          elif [[ "$arm64_check" == "true" ]]; then
            legs=("$arm64")
          else
            # Nothing builds here; the Build job is gated off and never reads this.
            legs=("$amd64")
          fi
          matrix="{\"include\":[$(IFS=,; echo "${legs[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  commit-check:
    name: Commit messages
    # Landing gate for conventional-commit messages. Deliberately NOT gated
    # on plan.outputs.run-checks: a cheap git-log + regex check must validate
    # what actually reaches main on EVERY merge, not only publish-worthy
    # pushes (all the quality job covers). Fatal on push to main (what lands);
    # advisory on pull_request (branch commits may be squashed away - see
    # commit_validation.run). Feature-branch pushes skip it, so the fast
    # chore-skip path is untouched. See CLAUDE.md CI gate doctrine.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Validate commit messages
        run: ${{ env.HYPERCI_INSTALL }} check-commits

  quality:
    name: Quality
    # At least twice the longest successful run across the fleet, which is
    # dfe-transform-elastic's 39-minute feature matrix (issue #262).
    timeout-minutes: 90
    needs: [plan]
    if: needs.plan.outputs.run-checks == 'true'
    # Renovate branches use lightweight runners -- dependency update PRs don't need 16cpu
    runs-on: ${{ startsWith(github.head_ref || github.ref_name, 'renovate/') && (vars.GH_RUNNER_RENOVATE_RUST || vars.GH_RUNNER_RUST || 'ubuntu-latest') || (inputs.runner-mode || vars.GH_RUNNER_MODE) == 'free' && 'ubuntu-latest' || inputs.runner-quality || vars.GH_RUNNER_RUST || vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Docker Hub login
        # A fork PR can read the var but not the secret, so an unguarded login
        # would authenticate with an empty password and fail the job.
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup runtime (uv + Python + native deps)
        uses: hyperi-io/hyperi-ci/.github/actions/setup-runtime@main
        with:
          language: rust

      - name: Install Rust toolchain
        if: ${{ runner.environment != 'self-hosted' }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt

      - name: Cache cargo
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # NOT ~/.cargo/bin/ in THIS job: it only ever held cargo-audit /
          # cargo-deny, which now arrive pinned from setup-rust-tools into
          # ~/.local/bin. Restoring a pre-migration entry puts STALE tool
          # binaries back on PATH (observed: a cached cargo-audit 0.18.3 under a
          # v0.22.2 pin). The key hashes Cargo.lock, so a repo with a stable
          # lockfile would keep that entry warm indefinitely. setup-rust-tools
          # already wins via a GITHUB_PATH prepend; dropping the dir removes the
          # ambiguity rather than relying on PATH order alone.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust tools
        uses: hyperi-io/hyperi-ci/.github/actions/setup-rust-tools@main

      - name: Setup osv-scanner
        uses: hyperi-io/hyperi-ci/.github/actions/setup-osv-scanner@main

      - name: Deepen history for secret scan
        # gitleaks scans the branch git log for committed secrets; a depth-1
        # checkout would only see HEAD. Deepen so the scan covers the pushed
        # range. Conventional-commit validation moved to the commit-check job
        # (its own fetch-depth: 0 checkout). Harmless on an already-full clone.
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: git fetch --deepen=200 origin

      - name: Run quality checks
        env:
          GITLEAKS_GH_ACTIONS_KEY: ${{ secrets.GITLEAKS_GH_ACTIONS_KEY }}
        run: ${{ env.HYPERCI_INSTALL }} run quality

  test:
    # The tier is in the name so a check list shows what ran. The runner is
    # spelled out so the name stays one bracket: Test (core, arc-native-4cpu).
    name: Test (${{ needs.plan.outputs.test-tier }}, ${{ matrix.os }})
    needs: [plan]
    if: needs.plan.outputs.run-checks == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJson(startsWith(github.head_ref || github.ref_name, 'renovate/') && format('["{0}"]', vars.GH_RUNNER_RENOVATE_RUST || vars.GH_RUNNER_RUST || 'ubuntu-latest') || (inputs.runner-mode || vars.GH_RUNNER_MODE) == 'free' && '["ubuntu-latest"]' || inputs.test-matrix || format('["{0}"]', inputs.runner-test || vars.GH_RUNNER_RUST || vars.GH_RUNNER_DEFAULT || 'ubuntu-latest')) }}
    steps:
      - name: Docker Hub login
        # A fork PR can read the var but not the secret, so an unguarded login
        # would authenticate with an empty password and fail the job.
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup runtime (uv + Python + native deps)
        uses: hyperi-io/hyperi-ci/.github/actions/setup-runtime@main
        with:
          language: rust

      - name: Install Rust toolchain
        if: ${{ runner.environment != 'self-hosted' }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Cache cargo
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup cargo-nextest
        uses: hyperi-io/hyperi-ci/.github/actions/setup-nextest@main

      - name: Init submodules
        if: ${{ inputs.submodules != '' }}
        env:
          SUBMODULES: ${{ inputs.submodules }}
        run: git submodule update --init --depth 1 $SUBMODULES

      - name: Clone sibling checkouts
        if: ${{ inputs.sibling-checkouts != '' }}
        env:
          SIBLINGS: ${{ inputs.sibling-checkouts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for spec in $SIBLINGS; do
            repo="${spec%@*}"
            ref="${spec#*@}"
            [ "$ref" = "$spec" ] && ref=""
            git clone --depth 1 ${ref:+--branch "$ref"} \
              "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" \
              "../$(basename "$repo")"
          done

      - name: Run tests
        # --tier full only on a full run: a CLI without the flag fails loudly
        # rather than running core under a full name, and a core run passes
        # nothing, so the project's own test.tier still applies.
        run: ${{ env.HYPERCI_INSTALL }} run test ${{ needs.plan.outputs.test-tier == 'full' && '--tier full' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-rust-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build (${{ matrix.os_arch }})
    # At least twice the longest successful run across the fleet (issue #262).
    timeout-minutes: 135
    needs: [plan, quality, test]
    # The second clause is the arm64-parity case (issue #249): a release-worthy
    # merge to main builds the arm64 leg alone, so an arm64 regression is found
    # where it is still attributable rather than during the release that ships
    # it. The matrix holds arm64 only there; see the plan job's matrix step.
    if: needs.plan.outputs.run-build == 'true' || needs.plan.outputs.run-arm64-check == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      # A leg that dies on its runner must not cancel a leg that finished:
      # the amd64 binary is worth keeping when the arm64 runner starves.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Stamp predicted version
        # Version-first pipeline: write the version we're about to tag
        # into Cargo.toml + VERSION before `cargo build`, so the binary
        # has the correct CARGO_PKG_VERSION baked in. Without this we'd
        # publish a v1.18.3 release containing a binary that introspects
        # itself as 1.18.2 -- every metrics dashboard would lie.
        #
        # Runs on push AND on a from-head dispatch (issue #35) -- both
        # release HEAD, whose committed tree is stale under the tagger-only
        # model (the bumped version is never committed). next-version is the
        # resolved value (semantic-release on auto, last+bump on a forced
        # patch/minor, or the explicit X.Y.Z override). A plain `tag`
        # dispatch is skipped: it checks out the tag's own tree, already
        # correct. Validate-only runs are skipped too (nothing ships).
        if: needs.plan.outputs.will-release == 'true' && (github.event_name == 'push' || inputs.from-head == 'true')
        run: |
          version="${{ needs.plan.outputs.next-version }}"
          if [[ -z "$version" ]]; then
            echo "::error::next-version output empty — plan.predict step must populate it"
            exit 1
          fi
          echo "Stamping version: $version"

          if grep -qE '^\[package\]' Cargo.toml; then
            sed -i -E "/^\[package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/version = \"$version\"/" Cargo.toml
          fi

          if grep -qE '^\[workspace\.package\]' Cargo.toml; then
            sed -i -E "/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/version = \"$version\"/" Cargo.toml
          fi

          if [[ -f VERSION ]]; then
            echo "$version" > VERSION
          fi

          echo "--- Cargo.toml after stamp:"
          grep -E '^version[[:space:]]*=' Cargo.toml | head -3
          [[ -f VERSION ]] && echo "--- VERSION: $(cat VERSION)"

      - name: Setup runtime (uv + Python + native deps)
        uses: hyperi-io/hyperi-ci/.github/actions/setup-runtime@main
        with:
          language: rust

      - name: Install Rust toolchain
        if: ${{ runner.environment != 'self-hosted' }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Cache cargo
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run build
        env:
          RUST_BUILD_TARGETS: ${{ matrix.target }}
          # Optimisation TIER. Tier 2 (PGO + BOLT) adds ~14 min per arch, so it
          # runs for a build that ships -- the same signal that gates the stamp
          # step above -- or when a dispatch asks for it with optimize-tier,
          # which the build reads from HYPERCI_OPTIMIZE_TIER (issue #257). A
          # prerelease ships, so it is built at the release tier by default:
          # that is the release rehearsal (issue #144).
          HYPERCI_CHANNEL: ${{ needs.plan.outputs.will-release == 'true' && 'release' || '' }}
          # Version IDENTITY, independent of the tier above. True when the
          # build spends no stable version, which is what lets `skip-optimize`
          # cut a fast prerelease without the release-unoptimized consent.
          HYPERCI_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: ${{ env.HYPERCI_INSTALL }} run build

      - name: Generate deployment artefacts
        # Runs the freshly built binary's `generate-artefacts` subcommand
        # to emit Dockerfile.runtime + container-manifest.json (+ ArgoCD)
        # into ci-tmp/. MUST run on the Build runner where the toolchain's
        # runtime libs (librdkafka, libssl, etc.) are present.
        # Skipped silently for projects without a deployment contract.
        run: ${{ env.HYPERCI_INSTALL }} run generate

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-dist-${{ matrix.os_arch }}
          path: |
            dist/
            ci-tmp/
          if-no-files-found: ignore
          retention-days: 1

  release-tail:
    name: Release tail
    needs: [plan, build]
    # The tail used to be reached exactly when Build ran, since both keyed off
    # run-build. The arm64-parity build (issue #249) breaks that: it compiles
    # one leg to catch a regression and ships nothing, so the container build
    # the tail would run is cost with no deliverable behind it.
    if: needs.plan.outputs.run-build == 'true'
    # Elevated + passed to _release-tail.yml: its tag-and-release job commits +
    # tags (contents), pushes GHCR (packages) and runs the semantic-release GH
    # plugin (issues + pull-requests). Capped by the caller's grant.
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    uses: hyperi-io/hyperi-ci/.github/workflows/_release-tail.yml@main
    with:
      language: rust
      will-publish: ${{ needs.plan.outputs.will-release }}
      next-version: ${{ needs.plan.outputs.next-version }}
      tag: ${{ inputs.tag }}
      from-head: ${{ inputs.from-head }}
      bump: ${{ inputs.bump }}
      publish-target: ${{ inputs.publish-target }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      submodules: ${{ inputs.submodules }}
      skip-optimize: ${{ inputs.skip-optimize }}
      release-unoptimized: ${{ inputs.release-unoptimized }}
      optimize-tier: ${{ inputs.optimize-tier }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # gate -- the terminal context branch protection should require.
  #
  # Requiring `ci / Quality` does not work: GitHub counts a SKIPPED required
  # check as satisfied, so the doctrine's deliberate skip and a gate that never
  # fired are the same green tick from outside. This job ALWAYS runs, so the
  # context it publishes cannot be satisfied by a skip (issue #177).
  #
  # It does not re-implement the gate. It reads what the plan job decided and
  # what the jobs below actually did; the verdict lives in
  # hyperi_ci.gate_result so it is testable rather than inline shell.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate
    if: always()
    # commit-check is deliberately absent: it is not run-checks-gated, so it
    # already fires on every push and works as a required context by itself.
    needs: [plan, quality, test, build]
    runs-on: ubuntu-latest
    steps:
      # The CLI ships via uvx, which a bare runner does not have. Without this
      # the gate exits 127 and fails a run that was otherwise green.
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Report what actually ran
        env:
          HYPERCI_GATE_RUN_CHECKS: ${{ needs.plan.outputs.run-checks }}
          HYPERCI_GATE_RUN_BUILD: ${{ needs.plan.outputs.run-build }}
          HYPERCI_GATE_PLAN: ${{ needs.plan.result }}
          HYPERCI_GATE_QUALITY: ${{ needs.quality.result }}
          HYPERCI_GATE_TEST: ${{ needs.test.result }}
          HYPERCI_GATE_BUILD: ${{ needs.build.result }}
          HYPERCI_GATE_TEST_TIER: ${{ needs.plan.outputs.test-tier }}
          HYPERCI_GATE_WILL_RELEASE: ${{ needs.plan.outputs.will-release }}
          HYPERCI_GATE_FULL_REQUIRED: ${{ needs.plan.outputs.full-required-for-release }}
        run: ${{ env.HYPERCI_INSTALL }} gate-check
