# Project:   HyperI CI
# File:      .github/actions/predict-version/action.yml
# Purpose:   Composite action — detect publish trigger + predict next version
#
# License:   BUSL-1.1 — HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Used by every language-specific workflow's `setup` job. Encapsulates
# the universal "is this a publish run, and what version?" decision so
# the rust/go/python/ts workflows don't duplicate ~80 lines of identical
# bash + npm install.
#
# The matrix-generation step that follows is language-specific (target
# triples for Rust/Go, single-arch for Python/TS) and stays in the
# calling workflow.

name: Predict version
description: Detect Publish trigger + run semantic-release dry-run for next version

inputs:
  github-token:
    description: GitHub token (for semantic-release dry-run)
    required: true
  tag:
    description: "Tag to re-publish on a workflow_dispatch (retroactive). Empty on a from-head or push run."
    required: false
    default: ""
  from-head:
    description: "'true' on a from-head dispatch (issue #35): resolve version for tagging HEAD"
    required: false
    default: ""
  bump:
    description: "Version resolution for from-head: auto (semantic-release picks) | patch | minor (forced)"
    required: false
    default: "auto"
  branch-build:
    description: "'true' to run build + container on pull_request events (branch-mode: PRs validate the full pipeline; whether the container also pushes a dev image is the separate publish.container.dev_push opt-in in .hyperi-ci.yaml)"
    required: false
    default: ""
  python-version:
    description: "Fallback Python version. The project's own declaration wins over it -- a pegged .python-version, else the requires-python floor."
    required: false
    # hyperi-ci:pin runtimes.python
    default: "3.14"

outputs:
  will-release:
    description: "'true' iff this run should tag + release"
    value: ${{ steps.gate.outputs.will-publish }}
  will-publish:
    description: "Deprecated spelling of will-release, same value. Kept because a reusable workflow cannot warn about an output a caller reads."
    value: ${{ steps.gate.outputs.will-publish }}
  version:
    description: "Predicted next version (without 'v' prefix); set on push and on from-head dispatch"
    value: ${{ steps.predict.outputs.version || steps.forced.outputs.version }}
  prerelease:
    description: "'true' iff the predicted version carries a prerelease component (1.2.0-beta.1) — this run does not consume a stable version"
    value: ${{ steps.derive.outputs.prerelease }}
  run-checks:
    description: "'true' iff quality + test should run (publish-worthy commit OR pull_request)"
    value: ${{ steps.derive.outputs.run-checks }}
  run-build:
    description: "'true' iff build + container + publish should run (publish-worthy only)"
    value: ${{ steps.derive.outputs.run-build }}
  python-version:
    description: "Python version this project is built and tested on"
    value: ${{ steps.python.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Resolve the project's Python version
      # The fleet default answers "what does a project that declares nothing
      # get?" -- it is not a version every project is held to. A repo declaring
      # `requires-python = ">=3.12"` built on 3.14 publishes a wheel whose own
      # advertised floor never ran (issue #150).
      #
      # uv honours a pegged `.python-version` natively, but resolves a floor to
      # the NEWEST satisfying interpreter -- so the FLOOR is computed here and
      # handed to the jobs explicitly. Testing above the floor hides the exact
      # bug this catches: a 3.14-only feature in a repo that promises 3.12.
      id: python
      shell: bash
      env:
        DEFAULT_PYTHON: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        resolved=$(python3 "$GITHUB_ACTION_PATH/python_version.py")
        echo "python-version=$resolved" >> "$GITHUB_OUTPUT"
        echo "::notice::Python $resolved"

    - name: Detect publish trigger
      # Gate the entire publish flow on one signal: `will-publish`.
      #
      # - workflow_dispatch with a tag input → always publish (retroactive).
      # - workflow_dispatch with from-head: true → publish HEAD.
      # - push to main with `Release: true` trailer in HEAD commit → release.
      # - push to a declared prerelease branch with the same trailer →
      #   release on that branch's own sequence (1.2.0-beta.1), which spends
      #   no stable version (issue #144).
      # - everything else, a bare workflow_dispatch included → validate-only
      #   (no version stamp, no tag, no container push, no registry uploads).
      id: gate
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # A dispatch publishes in exactly one of two modes, each of which
          # resolves a real version: `tag=vX.Y.Z` re-publishes an existing
          # release (version = the tag), and `from-head=true` releases HEAD
          # (the CI computes + cuts the tag). A bare dispatch resolves neither,
          # and publishing one named from the committed manifest seed rebuilt a
          # four-month-old version and clobbered `latest` (issue #105).
          #
          # So a bare dispatch runs the pipeline and publishes nothing (issue
          # #111): tag-and-release is gated on `will-publish` and the container
          # stage reads HYPERCI_RELEASE_MODE from it, so false reaches no
          # registry.
          if [[ -z "${{ inputs.tag }}" && "${{ inputs.from-head }}" != "true" ]]; then
            echo "will-publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bare workflow_dispatch — validate-only run. Quality, test and build run; NOTHING is tagged or published. To release, re-run with from-head=true (bump=auto|patch|minor|X.Y.Z), or tag=vX.Y.Z to re-publish an existing release."
            exit 0
          fi
          echo "will-publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Triggered by workflow_dispatch — publish run"
          exit 0
        fi

        # Stable releases happen only from main (branch-mode decision 1).
        # A branch the release config declares `prerelease` also releases,
        # but on its own version sequence (1.2.0-beta.1), so the stable
        # numbers never move -- that is what makes a release rehearsable
        # (issue #144). Stated HERE, at the gate SSOT, rather than relying
        # on downstream job `if:` conditions to catch a trailer on a
        # branch. A trailer on any other ref is ignored LOUDLY.
        if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
          prerelease=$(python3 "$GITHUB_ACTION_PATH/prerelease_branch.py")
          if [[ "$prerelease" != "true" ]]; then
            echo "will-publish=false" >> "$GITHUB_OUTPUT"
            msg=$(git log -1 --format=%B HEAD)
            if printf '%s' "$msg" | grep -qiE '^[[:space:]]*(Release|Publish):[[:space:]]*true[[:space:]]*$'; then
              echo "::warning::Release trailer on ref '${{ github.ref }}' — ignored. Releasing happens from main, or from a branch declared 'prerelease' in the release config; merge first, or push to a declared prerelease branch."
            fi
            echo "Not a release branch — validate-only run (no tag, no publish)"
            exit 0
          fi
        fi

        # push to a release branch — match the release trailer, either
        # spelling (case-insensitive on key). hyperi_ci.vocabulary matches the
        # same set in Python; this runs where hyperi-ci is not installed.
        msg=$(git log -1 --format=%B HEAD)
        if printf '%s' "$msg" | grep -qiE '^[[:space:]]*(Release|Publish):[[:space:]]*true[[:space:]]*$'; then
          echo "will-publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Release trailer detected — this run tags and publishes"
        else
          echo "will-publish=false" >> "$GITHUB_OUTPUT"
          echo "No release trailer — validate-only run (no tag, no publish)"
        fi

    - name: Setup semantic-release (shared toolchain — single source of truth)
      # Runs on push, and on a from-head `auto` dispatch (issue #35) so the
      # version is resolved in plan (the build then stamps the correct value).
      # Forced bumps use the inline semver step below and skip semantic-release.
      if: ${{ steps.gate.outputs.will-publish == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.from-head == 'true' && inputs.bump == 'auto')) }}
      uses: hyperi-io/hyperi-ci/.github/actions/setup-semantic-release@main

    - name: Predict next version
      # Run semantic-release in --dry-run to determine the version that
      # the tag-and-release job will eventually create. The build job
      # in the calling workflow stamps Cargo.toml + VERSION to this
      # value BEFORE compiling, so CARGO_PKG_VERSION (used in
      # AppMetrics, --version flags, log output) matches the published
      # tag.
      #
      # Hard fail if `Release: true` was set but no release-worthy
      # commits exist — silent skip violates "nothing should say it
      # worked if it didn't."
      #
      # We capture the dry-run exit code separately so a real crash
      # (npm install failure, network, etc.) is distinguished from
      # "ran successfully but no version to release."
      id: predict
      if: ${{ steps.gate.outputs.will-publish == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.from-head == 'true' && inputs.bump == 'auto')) }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set +e
        dry_output=$(npx semantic-release --dry-run 2>&1)
        dry_rc=$?
        set -e
        echo "$dry_output"

        if [[ $dry_rc -ne 0 ]]; then
          echo "::error::semantic-release --dry-run exited $dry_rc — see log above"
          exit $dry_rc
        fi

        # The prerelease component is part of the version: a release off a
        # prerelease branch is `1.2.0-beta.1`, and truncating it to `1.2.0`
        # would tag the stable number this run exists to avoid spending.
        version=$(printf '%s\n' "$dry_output" | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | head -1 | awk '{print $5}')

        if [[ -z "$version" ]]; then
          echo "::error::No release-worthy commits since last tag. On a push, drop the 'Release: true' trailer (this is a non-release commit) or land a fix:/feat:/perf: commit. On a from-head dispatch, re-run with --bump patch (or minor) to force a release."
          exit 1
        fi

        # Orphaned-tag guard (issue #37): semantic-release only considers
        # tags REACHABLE from HEAD ('No git tag version found on branch
        # main'). If v* tags exist in refs but NONE are reachable, a past
        # history rewrite orphaned them — semantic-release re-predicts a
        # taken or regressed version. Fail at plan time (the _release-tail
        # off-HEAD guard stays as defence-in-depth) instead of after a
        # full build. Tags are local: the plan checkout is fetch-depth: 0.
        tags_all=$(git tag --list 'v[0-9]*')
        tags_reachable=$(git tag --list 'v[0-9]*' --merged HEAD)
        if [[ -n "$tags_all" && -z "$tags_reachable" ]]; then
          echo "::error::v* tags exist but none are reachable from HEAD — orphaned by a past history rewrite (issue #37). semantic-release is blind to them and predicted v${version}, which would collide or regress. Recover the tags with scripts/recover-tags.py, or ship past them with 'hyperi-ci publish --version X.Y.Z'."
          exit 1
        fi

        # First release on a genuinely tag-less repo: semantic-release
        # defaults to 1.0.0 ('There is no previous release'). The starting
        # version comes from the project's own manifest instead, shipped
        # verbatim as the first release. The forced --bump paths bump from
        # the same value; see push._compute_next_version.
        #
        # Not the committed VERSION file (issue #85) — that is an artefact
        # this tool writes, not an input.
        #
        # A prerelease keeps semantic-release's own answer: the seed names a
        # stable starting version, and stamping it over `1.0.0-beta.1` would
        # cut the first stable release off a prerelease branch.
        if [[ -z "$tags_all" && "$version" != *-* ]]; then
          start=$(python3 "$GITHUB_ACTION_PATH/seed_version.py")
          if [[ -n "$start" && "$start" != "$version" ]]; then
            echo "::notice::First release on a tag-less repo — starting at $start (semantic-release default was $version)"
            version="$start"
          fi
        fi

        # Early collision guard: the predicted NEXT version must not
        # already exist as a tag off-HEAD (existing at HEAD = idempotent
        # re-run, allowed). Plan-time twin of the _release-tail guard.
        if git rev-parse -q --verify "refs/tags/v${version}^{commit}" >/dev/null 2>&1; then
          existing=$(git rev-parse "refs/tags/v${version}^{commit}")
          head_sha=$(git rev-parse "HEAD^{commit}")
          if [[ "$existing" != "$head_sha" ]]; then
            echo "::error::Predicted v${version} already exists at ${existing} (HEAD is ${head_sha}) — refusing to re-release it (issue #37). Ship past it with 'hyperi-ci publish --version X.Y.Z' (or --bump patch), or recover orphaned tags with scripts/recover-tags.py."
            exit 1
          fi
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "::notice::Predicted next version: v$version"

    - name: Predict next version (forced bump / explicit version)
      # from-head dispatch with a non-auto bump (issue #35). The `bump`
      # channel carries either a bump level (patch|minor — release HEAD even
      # with no release-worthy commit, computed as `last v* tag + bump`) or an
      # explicit X.Y.Z (the `hyperi-ci release --version` override, used
      # verbatim to step past a taken/orphaned tag — the issue #37 case). Runs
      # for any non-auto, non-empty bump so plan + build stamp the same value
      # tag-head later creates in Tag & Release. Trivial glue: semver math +
      # a regex; the same computation lives in push.tag_head for the real tag.
      id: forced
      if: ${{ steps.gate.outputs.will-publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.from-head == 'true' && inputs.bump != 'auto' && inputs.bump != '' }}
      shell: bash
      run: |
        set -euo pipefail
        bump='${{ inputs.bump }}'

        # Explicit version override: use it verbatim, no last-tag math.
        if printf '%s' "$bump" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "version=$bump" >> "$GITHUB_OUTPUT"
          echo "::notice::Explicit from-head version: v$bump"
          exit 0
        fi

        # Plain vX.Y.Z only -- a prerelease sorts above its own release under -v:refname.
        latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' || true)
        if [[ -z "$latest" ]]; then
          latest=$(python3 "$GITHUB_ACTION_PATH/seed_version.py")
        fi
        if [[ -z "$latest" ]]; then
          echo "::error::No v* tag and no declared version — cannot compute forced bump."
          exit 1
        fi
        IFS='.' read -r maj min pat <<< "$latest"
        case "$bump" in
          patch) pat=$((pat + 1)) ;;
          minor) min=$((min + 1)); pat=0 ;;
          *) echo "::error::Invalid bump '$bump' — expected patch, minor, or X.Y.Z"; exit 1 ;;
        esac
        version="${maj}.${min}.${pat}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "::notice::Forced from-head bump ($bump): v$version (was v$latest)"

    - name: Detect a release-worthy push
      # The doctrine runs checks on PR review and RELEASE-WORTHY pushes, but
      # the code only ever asked for the release trailer -- which marks
      # a push that PUBLISHES, a strictly smaller set. So an ordinary squash
      # merge of a fix: to main compiled nothing, tested nothing and reported
      # green (issue #124). Ask the bump SSoT what the pushed range holds.
      #
      # The range comes from the push event payload, never origin/main..HEAD,
      # which is EMPTY right after a push to main (issue #52). The helper reads
      # the payload itself, so no commit message is ever read as shell.
      id: worthy
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        set -euo pipefail
        worthy=$(python3 "$GITHUB_ACTION_PATH/release_worthy.py")
        echo "release-worthy=$worthy" >> "$GITHUB_OUTPUT"

    - name: Derive gate outputs
      # Single source of truth for the run-checks / run-build conditions.
      # Language workflows read these outputs and never re-implement the
      # boolean logic. If you find yourself writing `will-publish == 'true'
      # || event_name == 'pull_request'` anywhere else, you've drifted.
      id: derive
      shell: bash
      run: |
        set -euo pipefail
        will_publish='${{ steps.gate.outputs.will-publish }}'
        event_name='${{ github.event_name }}'
        branch_build='${{ inputs.branch-build }}'
        git_ref='${{ github.ref }}'
        release_worthy='${{ steps.worthy.outputs.release-worthy }}'
        version='${{ steps.predict.outputs.version || steps.forced.outputs.version }}'

        # Version identity: a prerelease component means this run ships on its
        # own sequence and spends no stable number. Read off the version rather
        # than the branch, so one value answers it everywhere
        # (hyperi_ci.release_branches is the same test in Python).
        if [[ "$version" == *-* ]]; then
          prerelease=true
        else
          prerelease=false
        fi
        echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

        # run-build: publish runs always; an opted-in pull_request also
        # builds (branch-mode decision 2 — PRs validate the FULL pipeline
        # incl. container; whether that container is pushed as a dev
        # image is the container stage's own dev_push decision). Raw
        # branch pushes never build — the gate doctrine (non-shipping
        # commits compile nothing) is unchanged.
        #
        # A validate-only dispatch builds too: someone with actions:write
        # asked for this run, and a verification run that compiles nothing
        # verifies nothing (issue #111). By here that is the only dispatch
        # left, since both publishing modes set will-publish=true.
        if [[ "$will_publish" == "true" ]]; then
          run_build=true
        elif [[ "$event_name" == "workflow_dispatch" ]]; then
          run_build=true
        elif [[ "$event_name" == "pull_request" && "$branch_build" == "true" ]]; then
          run_build=true
        else
          run_build=false
        fi

        # run-checks: a publish run, a PR, a dispatch -- and a merge to main
        # that CARRIES a release, whether or not this run is the one that
        # ships it (issue #124). run-build deliberately stays publish-only:
        # compiling a commit nothing ships is the red line the doctrine draws.
        if [[ "$will_publish" == "true" || "$event_name" == "pull_request" || "$event_name" == "workflow_dispatch" || "$release_worthy" == "true" ]]; then
          run_checks=true
        else
          run_checks=false
        fi

        echo "run-build=$run_build" >> "$GITHUB_OUTPUT"
        echo "run-checks=$run_checks" >> "$GITHUB_OUTPUT"
        summary="run-checks=$run_checks run-build=$run_build (will-publish=$will_publish event=$event_name branch-build=$branch_build release-worthy=$release_worthy prerelease=$prerelease)"
        # A gate that skipped reads exactly like a gate that passed, which is
        # the whole of issue #96 -- so say so where it lands, on main.
        if [[ "$run_checks" != "true" && "$event_name" == "push" && "$git_ref" == "refs/heads/main" ]]; then
          echo "::warning::$summary -- quality and test did NOT run on this merge to main. A skipped gate is not a passing gate."
        else
          echo "::notice::$summary"
        fi
