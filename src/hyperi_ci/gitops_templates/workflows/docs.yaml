name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # enable-cache:false -- installs mkdocs-material as a TOOL (uv tool install),
      # not project deps, and a gitops repo has no uv.lock. setup-uv hard-errors
      # on enable-cache:true when no **/uv.lock is found.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install MkDocs
        run: uv tool install mkdocs-material
      - name: Build
        run: mkdocs build --strict

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # enable-cache:false -- installs mkdocs-material as a TOOL (uv tool install),
      # not project deps, and a gitops repo has no uv.lock. setup-uv hard-errors
      # on enable-cache:true when no **/uv.lock is found.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install MkDocs
        run: uv tool install mkdocs-material
      - name: Deploy
        run: mkdocs gh-deploy --force
