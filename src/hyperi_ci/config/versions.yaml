#
# SSOT for every versioned dependency in the CI workflows AND composite
# actions. The pre-commit hook (scripts/update-versions.py --fix) keeps the
# pipeline pinned to these exact SHAs.
#
# Actions pin to a commit SHA with a `# <version>` comment — a tag can be
# force-moved, a SHA can't (supply-chain hardening). Policy + the Renovate
# split: docs/dependencies/deps-pinning.md.
#
# Update script: uv run scripts/update-versions.py
#   --check         current vs SSOT (dry run, default)
#   --apply         rewrite workflows + composites to match this file
#   --fix           --apply + non-zero exit on change (pre-commit hook)
#   --stable        report newest release >= 7 days old per action
#   --auto-update   bump to those, validate LOCALLY, revert on failure. It
#                   does not commit and does not trigger remote CI - the
#                   ci-test-* fleet validates on the PR.

# GitHub Actions — SHA-pinned, 7-day cooldown (see _select_pinned_release)
actions:
  checkout:
    version: v7.0.1
    sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
  setup-node:
    version: v7.0.0
    sha: 820762786026740c76f36085b0efc47a31fe5020
  setup-go:
    version: v7.0.0
    sha: b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
  setup-uv:
    version: v9.0.0
    sha: c771a70e6277c0a99b617c7a806ffedaca235ff9
  cache:
    version: v6.1.0
    sha: 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
  # Branch ref (dtolnay/rust-toolchain has no semver releases): pinned to
  # the newest master commit >= 7 days old. The toolchain itself is chosen
  # by the `with: toolchain:` input, not by the ref.
  rust-toolchain:
    version: master
    sha: 2c7215f132e9ebf062739d9130488b56d53c060c
  upload-artifact:
    version: v7.0.1
    sha: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
  download-artifact:
    version: v8.0.1
    sha: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
  # Mints the bot token the release tail pushes tags with: the highest-
  # privilege action in the pipeline, and the last `uses:` in .github/ still on
  # a moveable tag. (The gitops_templates/ scaffold still ships bare tags - a
  # separate surface, tracked separately.)
  #
  # max_major is the price of pinning it. `@v3` could never reach v4; a SHA pin
  # can, and auto-update's "a breaking major shows up as a red CI run" does not
  # hold here - the mint step sits behind `will-publish == 'true'`, so no PR
  # ever executes it and the first exposure would be a real fleet-wide release.
  # Lift the clamp by hand, having read v4's release notes.
  create-github-app-token:
    version: v3.2.0
    sha: bcd2ba49218906704ab6c1aa796996da409d3eb1
    max_major: 3
  # v4.6.0 was ~6.5 days old at pin time - inside the 7-day cooldown - taken
  # deliberately: it carries "Harden buildx scoped config path handling"
  # (PR 1059), and `action.yml` is byte-identical to v4.5.2 (same blob
  # 6eadfff765e47ed2882bd843fbe9a0193acc069d), so no consumer interface moves.
  docker-login:
    version: v4.6.0
    sha: dbcb813823bdd20940b903addbd779551569679f
  docker-setup-buildx:
    version: v4.2.0
    sha: bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
  # Prunes branch-mode dev images (_ghcr-prune.yml). Chosen over
  # snok/container-retention-policy: dataaxiom handles multi-arch
  # packages + attestation referrers safely (snok's README warns
  # against multi-platform use); verified maintained 2026-07.
  ghcr-cleanup:
    version: v1.2.2
    sha: d52806a0dc70b430571a37da1fde39733ffd640f
  # The next two appear ONLY in src/hyperi_ci/gitops_templates/workflows/, the
  # pipeline `init-gitops` hands to a scaffolded repo. Pinned here so that repo
  # starts on SHAs rather than the moveable tags it used to ship (issue #98).
  setup-helm:
    version: v5.0.1
    sha: 9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
  setup-opentofu:
    version: v2.0.2
    sha: a1320f892987e89d278cc92dc5adc984fb93aca4

# External CLI tools hyperi-ci installs at CI time.
#
# Same 7-day cooldown as actions above, and majors are eligible the same way.
# There is no compatibility clamp: holding a major back meant the estate sat
# on an old one until somebody made the manual edit, and nobody did.
#
# What that trades away is real, so know it. gitleaks v8 -> v9 can now
# auto-land, and a breaking CLI change is exactly what produced #64 (`detect`
# removed). For the 0.x tools - cargo-deny (0.20.2), cargo-audit (v0.22.2) -
# semver 4 makes the MINOR the breaking axis, so 0.20 -> 0.21 auto-lands too.
#
# The safety net is CI, not the clamp: every bump goes through a PR and the
# ci-test-* fleet exercises these tools for real. A tool whose flags moved
# shows up as a red quality stage there.
#
# `pin:` names a file that carries a copy of the version. It exists only for
# files GitHub parses before our code runs - a composite action's `default:`.
# Python reads this file directly via hyperi_ci.versions, so a Python-only tool
# has no `pin:` and no copy to drift. Anchor a copied line with
# `# hyperi-ci:pin tools.<name>`.
#
# `sha256:` pins the digest of the raw download per asset, keyed as that tool's
# asset names spell the arch. A release asset can be deleted and re-uploaded
# under the same tag, so the tag alone is not integrity. Refresh the digest in
# the same commit as the version; a stale one fails the install closed.
tools:
  # First pin of this tool. v0.14.0 was 4 days old at pin time - inside the
  # 7-day cooldown - taken deliberately: 0.13.0's repeatable `-c` silently
  # honours only the first config file, contradicting its own help text
  # (0.14.0 rejects multiple `-c` and fixes the contract).
  alint:
    version: v0.14.1
    repo: asamarts/alint
    sha256:
      x86_64: b310a0a7138cb847cf47dad759afd5ec7295cc4eee1a68cb167a83bcd5f961c4
      aarch64: 7fea929a4c788ea85f52cd81e3168ef54e87af86e79efe3485eb82ac8ed20164
  gitleaks:
    version: v8.30.1
    repo: gitleaks/gitleaks
    sha256:
      x64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      arm64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
  hadolint:
    version: v2.15.1
    repo: hadolint/hadolint
    sha256:
      x86_64: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      arm64: f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d
  kubeconform:
    version: v0.8.0
    repo: yannh/kubeconform
    sha256:
      amd64: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      arm64: 1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87
  kube-linter:
    version: v0.8.3
    repo: stackrox/kube-linter
    sha256:
      amd64: 618d299a3e2839c8ca9d86fce0db617be0fba41f0fecbbbfb7fbf1c04299fae1
      arm64: 9c39d35252e0dcafb16b26197b9e93ba578e44eb402c3c6660fc94e08f94094f
  # The five tools below are fetched by a COMPOSITE ACTION rather than by our
  # Python, because the quality job needs them before hyperi-ci is installed.
  # That is why their digests are mirrored into the action's `default:` inputs
  # as well as living here: GitHub parses a composite action before any of our
  # code runs, so it cannot read this file. update-versions.py writes those
  # mirrors; never hand-edit a marked line.
  osv-scanner:
    version: v2.4.0
    repo: google/osv-scanner
    pin: .github/actions/setup-osv-scanner/action.yml
    sha256:
      amd64: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
      arm64: 44e580752910f0ff36ec99aff59af20f65df1e859aa31e5605a8f0d055b496e9
  golangci-lint:
    version: v2.12.2
    repo: golangci/golangci-lint
    pin: .github/actions/setup-go-tools/action.yml
    sha256:
      amd64: 8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553
      arm64: 44cd40a8c76c86755375adfeea52cfd3533cb43d7bd647771e0ae065e166df3a
  gosec:
    version: v2.28.0
    repo: securego/gosec
    pin: .github/actions/setup-go-tools/action.yml
    sha256:
      amd64: d7882e505b1ff345d458bf0e893eec8019bc849f861ad73a212869540dd505ff
      arm64: 63259681b6e4b9e7a24d4e187b485e75d3844d28d512b0c97dc831e51d374720
  # No prebuilt binaries upstream (golang/vuln releases carry no assets), so
  # this one is still `go install` - but pinned, not @latest. Small pure-Go
  # module, so the compile costs seconds.
  govulncheck:
    version: v1.1.4
    repo: golang/vuln
    pin: .github/actions/setup-go-tools/action.yml
  # rustsec is a MONOREPO: every crate tags as `<crate>/vX.Y.Z`, so without
  # tag_prefix the release scan sees `platforms/v4.0.0` et al and either picks
  # the wrong crate or (because the tag is not bare semver) silently finds
  # nothing at all.
  #
  # cargo-audit is the ONE tool here whose release publishes no checksum file,
  # so its digests rest on our own download alone. The other four were each
  # cross-checked against upstream's published sums at pin time.
  cargo-audit:
    version: v0.22.2
    repo: rustsec/rustsec
    tag_prefix: cargo-audit/
    pin: .github/actions/setup-rust-tools/action.yml
    sha256:
      # amd64 is the musl build; arm64 is gnu, since no aarch64 musl is published.
      amd64: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
      arm64: c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd
  # Upstream tags have NO leading `v` - keep it that way, the download URL is
  # built from this string verbatim.
  cargo-deny:
    version: 0.20.2
    repo: EmbarkStudios/cargo-deny
    pin: .github/actions/setup-rust-tools/action.yml
    sha256:
      amd64: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      arm64: 995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d
  # Baked into the generated cargo-chef Dockerfile by container/compose.py,
  # which reads it from here.
  cargo-chef:
    version: v0.1.77
    repo: LukeMathWalker/cargo-chef

# Upstream capabilities we WANT but that are not ready yet.
#
# `--stable` prints these on every run, so the decision resurfaces at each
# dependency update instead of living in someone's memory. Each entry names the
# gate that would let it land - something checkable, not a vibe.
watch:
  uv-audit:
    what: replace pip-audit with `uv audit` (astral stack consolidation)
    blocked_by: >-
      experimental as of uv 0.11.29 (latest, 2026-07-15) - the command warns
      "may change without warning" and is gated behind
      `--preview-features audit-command`. pip-audit is a BLOCKING gate in 14
      repos; it does not ride on a preview command.
    gate: "`uv audit` runs with no experimental warning and no --preview-features"
    issue: 68

# Language runtimes (default versions in workflow inputs)
runtimes:
  python: "3.12"
  node: "22"
  rust: stable
  # Major used to resolve apt.llvm.org subpaths in config/toolchains/llvm.yaml.
  # HYPERCI_LLVM_VERSION overrides it per run.
  llvm: "22"

# npm packages (semantic-release toolchain)
semantic_release:
  core: "25"
  plugins:
    - "@semantic-release/commit-analyzer"
    - "@semantic-release/release-notes-generator"
    - "@semantic-release/changelog"
    - "@semantic-release/exec"
    - "@semantic-release/git"
    - "@semantic-release/github"
    - "conventional-changelog-conventionalcommits"
  # Plugins whose MAJOR is pinned in the install line, driven from here the same
  # way `core` is. A plugin listed above but absent here floats to latest.
  plugin_majors:
    # v10 requires conventional-changelog-writer@9, which core 25 does not
    # bring; unpinned, v10 broke the dry-run in every repo at once. Lifting this
    # means moving `core` with it.
    conventional-changelog-conventionalcommits: "9"
