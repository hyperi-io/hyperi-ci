# Project:   HyperI CI
# File:      src/hyperi_ci/config/labels.yaml
# Purpose:   The org issue label manifest, read through hyperi_ci.labels
#
# License:   BUSL-1.1 - HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Read by `hyperi-ci labels --check`, by hyperi-infra's label reconcile and by
# dfe-sweep, so a name, colour or description changed here changes all three.
# Colours are hex without `#`. Descriptions are the exact text to create, and
# GitHub caps a label description at 100 characters.

# Org issue types. Exactly one per issue, set natively, never as a label.
types:
  - name: Bug
    use_for: Shipped behaviour or a shipped doc is wrong
    not_for: A defect only in tests or fixtures (Task)
  - name: Feature
    use_for: >-
      A consumer can now do something significant at a contract boundary --
      the `feat:` test in git-release.md
    not_for: Internal plumbing, a flag on existing behaviour
  - name: Task
    use_for: >-
      Everything else: chore, refactor, test, CI, dead-code removal,
      dependency work, docs that add
    not_for: ""
  - name: Epic
    use_for: Multi-week work with named sub-issues, the seam to a program project
    not_for: A big Task with no sub-issues

# Release gate, exactly one per issue, STRICTEST FIRST. The order is the
# precedence when an issue carries more than one. No gate label = untriaged.
# These names are the one horizon vocabulary, programs below included.
# `set_by`: anyone, release-owner (agents never set it), or hand (a deliberate
# `gh issue edit` with a comment, never a tool's default).
gate:
  - name: release-blocker
    color: b60205
    description: The next release cut does not ship while this is open
    set_by: hand
  - name: next-patch
    color: 1d76db
    description: Wanted in an upcoming patch release. Does not hold a cut
    set_by: anyone
  - name: next-minor
    color: 5319e7
    description: Waits for the next minor release. Placed by the release owner
    set_by: release-owner
  - name: next-major
    color: 3b0a8c
    description: Waits for the next major release. Set by the release owner only, never proposed by agents
    set_by: release-owner
  - name: backlog
    color: d4c5f9
    description: Captured future work, not scheduled now
    set_by: anyone

# Release trains that span repos. Each takes the next-* horizons as
# `<program>:<horizon>`, coloured as the horizon, because release-blocker and
# backlog belong to each repo's own gate. `members`, `version` and `released`
# name the one file that answers each question, read from its repo's default
# branch.
# A repo leaving a program keeps its labels, because the reconcile never
# deletes one. To retire a family, move each of its labels into `retired:`
# and delete the program here.
programs:
  dfe:
    labels:
      next-patch: Wanted in the next DFE stack patch release. Does not hold a cut
      next-minor: Waits for the next DFE stack minor release. Placed by the release owner
      next-major: Waits for the next DFE stack major release. Release owner only, never proposed by agents
    # Every `nodes.<node>.repo`. No repo config repeats this list.
    members:
      repo: hyperi-io/dfe-infra
      path: suite.yaml
      key: nodes
    # The stack version every horizon resolves from, prereleases included.
    version:
      repo: hyperi-io/dfe-infra
      path: versions.yaml
      key: current
    # The last GA stack cut. A change of it is one program release.
    released:
      repo: hyperi-io/dfe-infra
      path: versions.yaml
      key: latest

# At most one per issue, with the decider as assignee.
waiting:
  - name: needs-decision
    color: fbca04
    description: Waiting on a decision. The assignee decides, the last comment names it

# Zero or more per issue.
flags:
  - name: security
    color: ee0701
    description: Security consequence. Grade reachability before severity
  - name: regression
    color: e99695
    description: Worked in an earlier release of this train and no longer does

# GitHub's own defaults, kept because GitHub surfaces them. Optional per repo.
community:
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed

# Created and applied by bots. Never applied by hand, and the colours are the bot's.
bot_owned:
  - released
  - released on @main
  - release-failure
  - release-commit-back
  - dependencies
  - rust
  - javascript
  - upstream-sync

# Declared by hyperi-ai's issue-management standard. `labels --check` accepts
# them and the reconcile never creates them. Patterns are Python `re`,
# matched against the whole name.
allowed:
  patterns:
    - "initiative:[a-z0-9]+(?:-[a-z0-9]+)*"
  literals:
    - dfe-v1
    - dfe-v2

# Per-repo areas come from `.hyperi-ci.yaml` `issues.areas`, one label each.
area:
  prefix: area/
  color: bfdadc

# Retired labels stay on the repo with this description, because deleting a
# label strips it from closed issues too. `{replacement}` is the map's value.
retired_description: "RETIRED: use {replacement}"
retired:
  bug: type Bug
  enhancement: type Feature or Task
  epic: type Epic
  "type: feat": type Feature
  "type: fix": type Bug
  "type: perf": type Task
  "type: refactor": type Task
  "type: chore": type Task
  "type: docs": type Task
  "type: ci": type Task
  "type: test": type Task
  "type: build": type Task
  breaking-change: no label, a major is the owner's call
  spike: "type Task, title spike:"
  post-ga: backlog or next-patch
  rc14: a gate label
  ga-candidate: release-blocker or next-patch
  ga-prep: release-blocker or next-patch
  blocked: needs-decision or blocked-by
  question: needs-decision or Discussions
  In progress: project Status
  duplicate: close as duplicate
  invalid: close as not planned
  wontfix: close as not planned
  documentation: area/docs
  docker: area/docker
  terraform: area/opentofu
