# Project:   HyperI CI
# File:      src/hyperi_ci/config/native-deps/python.yaml
# Purpose:   Native system dependency definitions for Python projects
#
# Schema per entry:
#   name:           Human-readable label shown in CI output
#   patterns:       Strings to search for in manifest_files (plain substring match)
#   manifest_files: Paths from the project root, or a glob (**/package.json)
#   dpkg_check:     dpkg package name -- skips apt install if already present
#   apt_packages:   Packages to install on Linux (apt-get)

- name: cryptography / OpenSSL
  patterns:
    - cryptography
    - pyOpenSSL
  manifest_files:
    - pyproject.toml
    - requirements.txt
    - uv.lock
  dpkg_check: libssl-dev
  apt_packages:
    - libssl-dev
    - libffi-dev

- name: psycopg / PostgreSQL
  patterns:
    - psycopg
    - psycopg2
  manifest_files:
    - pyproject.toml
    - requirements.txt
    - uv.lock
  dpkg_check: libpq-dev
  apt_packages:
    - libpq-dev

- name: confluent-kafka / C libraries
  patterns:
    - confluent-kafka
  manifest_files:
    - pyproject.toml
    - requirements.txt
    - uv.lock
  dpkg_check: librdkafka-dev
  apt_packages:
    - librdkafka-dev
    - libssl-dev
    - libsasl2-dev

# A Python project can pin node tools in a package.json below its root.
- name: headless Chrome (puppeteer)
  patterns:
    - '"puppeteer"'
    - '"@mermaid-js/mermaid-cli"'
  manifest_files:
    - '**/package.json'
  dpkg_check: libnss3
  apt_packages:
    - libnspr4
    - libnss3
    - libatk1.0-0t64
    - libatk-bridge2.0-0t64
    - libcups2t64
    - libdrm2
    - libxkbcommon0
    - libxcomposite1
    - libxdamage1
    - libxfixes3
    - libxrandr2
    - libgbm1
    - libpango-1.0-0
    - libcairo2
    - libasound2t64
