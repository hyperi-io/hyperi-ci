# Project:   HyperI CI
# File:      src/hyperi_ci/config/register-words.yaml
# Purpose:   The REGISTER words: LLM vocabulary a commit subject or PR title should not carry
#
# License:   BUSL-1.1 - HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# One entry per word:
#   term         the label a warning names
#   pattern      Python regex, compiled case-insensitive
#   replacement  what to write instead
#
# hyperi-ai reads this list through `hyperi-ci check-commit --register-words --json`.

words:
  - term: 'substrate'
    pattern: '\bsubstrate\b'
    replacement: 'name the layer: distro, cluster, broker, datastore, CNI, nodes'
  - term: 'load-bearing'
    pattern: '\bload[- ]bearing\b'
    replacement: 'say what breaks'
  - term: 'wall clock'
    pattern: '\bwall[- ]clock\b'
    replacement: 'actual time, real time, elapsed time'
  - term: 'obviously'
    pattern: '\bobviously\b'
    replacement: 'delete'
  - term: 'trivially'
    pattern: '\btrivially\b'
    replacement: 'delete'
  - term: 'footgun'
    pattern: '\bfoot[- ]?gun\b'
    replacement: 'name what breaks and how'
  - term: 'blast radius'
    pattern: '\bblast radius\b'
    replacement: 'name what breaks and how far it reaches'
  - term: 'paper over'
    pattern: '\bpaper(?:s|ed|ing)? over\b'
    replacement: 'say what is left unfixed'
  - term: 'north star'
    pattern: '\bnorth star\b'
    replacement: 'state the goal'
  - term: 'genuine'
    pattern: '\bgenuine(?:ly)?\b'
    replacement: 'delete'
  - term: 'worth noting'
    pattern: '\bit(?:''s| is) worth noting\b'
    replacement: 'delete, and note it'
  - term: 'simply'
    pattern: '\bsimply\b'
    replacement: 'delete'
  - term: 'merely'
    pattern: '\bmerely\b'
    replacement: 'delete'
  - term: 'effectively'
    pattern: '\beffectively\b'
    replacement: 'delete, or say what it actually does'
  - term: 'essentially'
    pattern: '\bessentially\b'
    replacement: 'delete, or say what it actually does'
  - term: 'delve'
    pattern: '\bdelv(?:e|es|ed|ing)\b'
    replacement: 'read, look at'
  - term: 'game-changer'
    pattern: '\bgame[- ]chang(?:er|ing)\b'
    replacement: 'say the measured difference'
  - term: 'cutting-edge'
    pattern: '\bcutting[- ]edge\b'
    replacement: 'say the measured difference'
  - term: 'testament to'
    pattern: '\btestament to\b'
    replacement: 'delete, and state the evidence'
  - term: 'landscape of'
    pattern: '\blandscape of\b'
    replacement: 'name the thing'
  - term: 'realm of'
    pattern: '\brealm of\b'
    replacement: 'name the thing'
  - term: 'underscores the'
    pattern: '\bunderscor(?:es|ing)\s+(?:the|a|an|our|its|how|why)\b'
    replacement: 'say the fact'
  - term: 'battle-tested'
    pattern: '\bbattle[- ]tested\b'
    replacement: 'say what it has survived'
  - term: 'serves as'
    pattern: '\bserv(?:es|ing) as\b'
    replacement: 'is, does'
  - term: 'foster a'
    pattern: '\bfoster(?:s|ing)?\s+(?:a|an|the)\b'
    replacement: 'say the mechanism'
  - term: 'pivotal'
    pattern: '\bpivotal\b'
    replacement: 'say what breaks without it'
  - term: 'seamless'
    pattern: '\bseamless(?:ly)?\b'
    replacement: 'say what the reader does not have to do'
  - term: 'deep dive'
    pattern: '\bdeep dive\b'
    replacement: 'read, look at'
  - term: 'first-class'
    pattern: '\bfirst[- ]class\b'
    replacement: 'say what it supports'
  - term: 'seam'
    pattern: '\bseams?\b'
    replacement: 'name the boundary: where the two halves meet'
  - term: 'wedge'
    pattern: '\bwedg(?:e|ed|es|ing)\b'
    replacement: 'stuck, held, blocked or jammed, or name the mechanism: the lease never expires'
  - term: 'posture'
    pattern: '(?<!security )(?<!crypto )(?<!cyber )\bposture\b'
    replacement: 'name the setting, mode or stance'
  - term: 'the following'
    pattern: '\bthe following\b'
    replacement: 'delete, and write the thing'
  - term: 'leverage (verb)'
    pattern: '\bleverag(?:ed|es|ing)\b|\bto leverage\b|\bleverage (?:the|a|an|our|your|its|their|this|that|these|those|existing)\b'
    replacement: 'use'
  - term: 'utilise'
    pattern: '\butili[sz](?:e|es|ed|ing|ation)\b'
    replacement: 'use'
  - term: 'robust'
    pattern: '\brobust(?:ly|ness)?\b'
    replacement: 'say what it withstands'
  - term: 'ensure (as a claim)'
    pattern: '\b(?:this|that|which|it)\s+ensures?\b|\bensures?\s+that\b'
    replacement: 'say what is checked, and what happens when it fails'
  - term: 'crucial'
    pattern: '\bcrucial\b'
    replacement: 'say what breaks without it'
  - term: 'vital'
    pattern: '\bvital\b'
    replacement: 'say what breaks without it'
  - term: 'dive into'
    pattern: '\bdiv(?:e|es|ed|ing)\s+into\b'
    replacement: 'read, look at'
  - term: 'navigate (metaphor)'
    pattern: '\bnavigat(?:e|es|ed|ing)\s+(?:the\s+)?(?:complexit|challenge|landscape|nuance|intricac|trade-?off)\w*'
    replacement: 'say the actual action'
  - term: 'highlight (verb)'
    pattern: '\bhighlight(?:s|ed|ing)?\s+(?:the|how|why|that|its|our)\b'
    replacement: 'say the fact'
  - term: 'unlock (metaphor)'
    pattern: '\bunlock(?:s|ed|ing)?\s+(?:the\s+)?(?:power|potential|value|insights?|new|possibilit\w*|capabilit\w*)\b'
    replacement: 'say what it now does'
  - term: 'empower'
    pattern: '\bempower(?:s|ed|ing|ment)?\b'
    replacement: 'say what it now does'
  - term: 'elevate'
    pattern: '\belevat(?:e|es|ing)\b(?!\s+(?:privileges?|permissions?|rights|access)\b)'
    replacement: 'say what it now does'
  - term: 'supercharge'
    pattern: '\bsupercharg(?:e|es|ed|ing)\b'
    replacement: 'say what it now does'
  - term: 'boasts'
    pattern: '\bboasts?\b'
    replacement: 'has'
  - term: 'offers up'
    pattern: '\boffers? up\b'
    replacement: 'has, does'
  - term: 'brings to the table'
    pattern: '\bbring(?:s|ing)? to the table\b'
    replacement: 'has, does'
  - term: 'in today''s world'
    pattern: '\bin today''?s (?:world|age|era|landscape)\b'
    replacement: 'delete'
  - term: 'in the modern era'
    pattern: '\bin the modern (?:era|age|world)\b'
    replacement: 'delete'
  - term: 'revolutionary'
    pattern: '\brevolutionary\b'
    replacement: 'say the measured difference'
  - term: 'holistic'
    pattern: '\bholistic(?:ally)?\b'
    replacement: 'say what it covers'
  - term: 'comprehensive'
    pattern: '\bcomprehensive(?:ly)?\b'
    replacement: 'say what it covers'
  - term: 'end-to-end'
    pattern: '\bend[- ]to[- ]end\b(?!\s+(?:tests?|testing|encrypt\w*|latency|tier|suite|runs?)\b)'
    replacement: 'say what it covers'
  - term: 'facilitate'
    pattern: '\bfacilitat(?:e|es|ed|ing|ion)\b'
    replacement: 'say the mechanism'
