# Project:   HyperI CI
# File:      src/hyperi_ci/config/bootstrap.yaml
# Purpose:   Language toolchain bootstrap for runner image bake
#
# License:   BUSL-1.1 - HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# The language runtimes a runner image pre-installs. Distinct from
# native-deps (apt system libraries) and toolchains (the LLVM apt family):
# these are the compilers themselves, installed from vendor channels rather
# than apt.
#
# WHY THESE ARE BAKED AND THE LINTERS ARE NOT
#
# A pre-baked tool only pays off if it is what would have been installed
# anyway. The linters fail that test - hyperi-ci reinstalls them per job, so
# baking them is either wasted or a silent override of a pinned version. So do
# cargo-audit, cargo-deny and cargo-nextest, which the setup-rust-tools and
# setup-nextest composites install pinned on every Rust job.
#
# These pass it, because hyperi-ci does NOT install them per job: it assumes
# they are already there. sccache
# is baked as well, at its versions.yaml pin, because the ARC image sets
# RUSTC_WRAPPER=sccache and no CI step installs it.
#
# The Rust channels track current. Every installer is a versions.yaml pin with
# a sha256: rustup-init (`tools.rustup`), Go (`runtimes.go`), nvm (`tools.nvm`)
# and sccache (`tools.sccache`). Node is not configured here: the image bakes
# the one major in versions.yaml `runtimes.node`, the CI default.

rust:
  # stable for builds, nightly for the fmt/lint features some repos use.
  channels:
    - stable
    - nightly
  components:
    - clippy
    - rustfmt

go:
  enabled: true
