[extend]
useDefault = true

[allowlist]
description = "PGP key fingerprints are public identifiers, not secrets"
regexTarget = "line"
regexes = [
  '''key_fingerprint: [0-9A-Fa-f]{40}''',
  '''_SUBKEY = "[0-9A-Fa-f]{40}"''',
  '''_AWS_CLI_KEY_FPR = "[0-9A-Fa-f]{40}"''',
]
